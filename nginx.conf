server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Die Seite ist eine Vorschau und soll noch nicht in Suchmaschinen landen.
    # Das Meta-Tag im HTML allein reicht nicht - Suchmaschinen lesen zuerst hier.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Sicherheitskopfzeilen. Kein CSP-Feinschliff noetig: Die Seite laedt keine
    # fremden Ressourcen, alles steht in der einen Datei.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML nicht zwischenspeichern, damit Aenderungen sofort sichtbar sind.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
