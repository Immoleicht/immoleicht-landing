server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Kopfzeilen ─────────────────────────────────────────────────────────
    #
    # ACHTUNG, nginx-Falle: Ein `add_header` INNERHALB eines location-Blocks
    # hebt die Vererbung ALLER add_header der Serverebene auf - lautlos. Genau
    # das ist hier zuerst passiert: Ein Cache-Control im location-Block hat die
    # vier Sicherheitskopfzeilen verschluckt, ohne dass nginx sich beschwert.
    #
    # Deshalb steht hier alles auf einer Ebene, und kein location-Block setzt
    # eine eigene Kopfzeile. Wer das aendert, muss die Kopfzeilen dort
    # wiederholen - oder sie verschwinden wieder.
    #
    # Die Content-Security-Policy darf so eng sein, weil die Seite nichts von
    # fremden Servern laedt: kein Skript, keine Schrift, kein Bild.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    # Die Seite ist eine Vorschau und soll noch nicht in Suchmaschinen landen.
    # Das Meta-Tag im HTML allein reicht nicht - Suchmaschinen lesen zuerst hier.
    #
    # default_type statt add_header: add_header wuerde die Kopfzeilen oben
    # ausser Kraft setzen, default_type nicht.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
